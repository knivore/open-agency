id: persona_writing_style
suite: persona_distillation
name: Persona writing-style extraction
mode: persona_distillation_fixture
description: Checks whether style signals remain source-backed.
persona_distillation:
  source_memories:
    - id: writing-style-note
      title: Writing preference note
      content: |
        Writing preference: keep recommendations concise, concrete, and ordered by priority.
        Avoid long preambles. Use short factual summaries before action items.
      tags: ["persona-live-eval", "writing-style"]
  expected_items:
    - id: concise_style
      item_type: writing_style
      memory_layer: persona
      content_keywords: ["concise", "concrete", "ordered by priority"]
      evidence: "keep recommendations concise, concrete, and ordered by priority"
  results:
