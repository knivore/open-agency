      items:
        - title: Concise style
          content: "Keep recommendations concise, concrete, and ordered by priority."
          item_type: writing_style
          memory_layer: persona
          source_evidence: "keep recommendations concise, concrete, and ordered by priority"
          evidence_verified: true
      metrics: {latency_ms: 5, cost_usd: 0.0}
    llm:
      items:
        - title: Concise recommendation style
          content: "Keep recommendations concise, concrete, and ordered by priority."
          item_type: writing_style
          memory_layer: persona
          source_evidence: "keep recommendations concise, concrete, and ordered by priority"
          evidence_verified: true
      metrics: {latency_ms: 70, cost_usd: 0.009}
    hybrid:
      items:
        - title: Concise recommendation style
          content: "Keep recommendations concise, concrete, and ordered by priority."
          item_type: writing_style
          memory_layer: persona
          source_evidence: "keep recommendations concise, concrete, and ordered by priority"
          evidence_verified: true
      metrics: {latency_ms: 74, cost_usd: 0.009}
assertions:
