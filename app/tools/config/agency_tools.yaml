            type:
              - string
              - "null"
            description: Optional package description used in the scaffold.
          function_name:
            type:
              - string
              - "null"
            description: Optional starter callable name written into tools.py.
          overwrite:
            type: boolean
            description: Whether existing scaffold files may be replaced.
        required: [ package_id, name ]
        additionalProperties: false
      output_schema_name: RESULT_OUTPUT_SCHEMA
      implementation:
