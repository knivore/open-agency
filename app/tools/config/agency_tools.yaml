    - id: agency.workflow.governance.audit
      name: get_workflow_governance_audit
      display_name: Get Workflow Governance Audit
      description: Audit workflow governance state by comparing stored improvement proposals and steering approvals against actual approval requests. Use this to detect mismatches, missing approval links, and orphaned approvals before repair.
      tool_type: WORKFLOW_TOOL
      input_schema:
        type: object
        properties:
          workflow_id: { type: string, description: ID of the workflow whose governance records should be audited. }
        required: [ workflow_id ]
        additionalProperties: false
      output_schema_name: RESULT_OUTPUT_SCHEMA
      implementation:
        implementation_type: workflow_tool
        target: agency.system.workflow
        callable_name: get_workflow_governance_audit
      security: { read_only: true }
      tags: [ system, workflow, governance, audit, agent_assignable, read_only ]
    - id: agency.workflow.governance.repair
      name: repair_workflow_governance_record
      display_name: Repair Workflow Governance Record
      description: Repair one workflow governance record after audit detects drift. Use this to link or relink an approval request, clear a stale approval link, or sync record status from the linked approval request.
      tool_type: WORKFLOW_TOOL
      input_schema:
        type: object
        properties:
          workflow_id:
            type: string
            description: ID of the workflow whose governance record should be repaired.
          record_kind:
            type: string
            enum: [ improvement_proposal, steering_approval ]
            description: Governance record family that owns the target record.
          record_id:
            type: string
            description: Governance record id returned by the proposal or steering approval tools.
          action:
            type: string
            enum: [ link_approval_request, unlink_approval_request, sync_status_from_approval ]
            description: Repair action to apply. Link attaches an approval request and updates approval metadata, unlink clears the stored approval_request_id, and sync_status_from_approval refreshes record status from its linked approval.
          approval_request_id:
            type: [ string, "null" ]
            description: Approval request id to attach when action is link_approval_request.
        required: [ workflow_id, record_kind, record_id, action ]
        additionalProperties: false
      output_schema_name: RESULT_OUTPUT_SCHEMA
      implementation:
        implementation_type: workflow_tool
        target: agency.system.workflow
        callable_name: repair_workflow_governance_record
      security: { read_only: false }
      tags: [ system, workflow, governance, repair, approval, agent_assignable, mutation ]
    - id: agency.workflow.governance.remediate
      name: remediate_workflow_governance
      display_name: Remediate Workflow Governance
      description: Apply conservative workflow-wide governance repairs using the current audit state. This only auto-fixes deterministic cases such as status mismatches, stale approval references, and orphaned approvals whose metadata already identifies one workflow governance record.
      tool_type: WORKFLOW_TOOL
      input_schema:
        type: object
        properties:
          workflow_id:
            type: string
            description: ID of the workflow whose governance records should be remediated.
          dry_run:
            type: [ boolean, "null" ]
            description: When true, preview the remediation plan without mutating workflow or approval state.
          sync_status_mismatches:
            type: [ boolean, "null" ]
            description: When true, refresh governance record status from linked approval requests when audit detects a status mismatch. Defaults to true.
          clear_orphaned_references:
            type: [ boolean, "null" ]
            description: When true, clear governance approval_request_id values that point at missing approvals. Defaults to true.
          adopt_orphaned_approvals:
            type: [ boolean, "null" ]
            description: When true, relink orphaned approval requests whose metadata already names one matching workflow proposal or steering record. Defaults to true.
        required: [ workflow_id ]
        additionalProperties: false
      output_schema_name: RESULT_OUTPUT_SCHEMA
      implementation:
        implementation_type: workflow_tool
        target: agency.system.workflow
        callable_name: remediate_workflow_governance
      security: { read_only: false }
      tags: [ system, workflow, governance, remediation, approval, agent_assignable, mutation ]
