      img_directory:
        mandatory: true
        type: "string"
        cloud_directory: true
        input_type: "hidden"
        filled_by: "agent"
        description: "Artifact directory for interaction screenshots."

  agency.browser.type-text:
    id: "agency.browser.type-text"
    name: "type_in_browser"
    display_name: "Type in Browser"
    description: "Type text into an input field or textarea on the current page using a natural-language field description and quoted text. Required input: `instruction`. Optional input: `sequence_number`. Output reports the typing result. Side effect: mutates browser/page state and may enter sensitive data if the instruction includes it."
    created_by: "agency"
    owned_by: "agency"
    parameters:
      instruction:
        mandatory: true
        type: "string"
        filled_by: "agent"
        description: "Natural-language description of the input field and text to enter."
      sequence_number:
        mandatory: false
        type: "integer"
        filled_by: "agent"
        description: "Optional screenshot sequence number to disambiguate a target."
      img_directory:
        mandatory: true
        type: "string"
        cloud_directory: true
        input_type: "hidden"
        filled_by: "agent"
        description: "Artifact directory for interaction screenshots."

  agency.browser.verify-content:
    id: "agency.browser.verify-content"
    name: "verify_browser_content"
    display_name: "Verify Browser Content"
    description: "Compare expected text or requirements against the current page content and return a score with reasoning. Use this after navigation or interactions to verify task completion. Required input: `text`, the expected content or verification instruction. Output includes score and reasoning. Side effect: read-only page inspection."
    created_by: "agency"
    owned_by: "agency"
    parameters:
      text:
        mandatory: true
        type: "string"
