      output_schema_name: RESULT_OUTPUT_SCHEMA
      implementation:
        implementation_type: workflow_tool
        target: agency.system.workflow
        callable_name: get_workflow_monitoring_events
      security:
        read_only: true
      tags: [ system, workflow, governance, monitor, review, agent_assignable, read_only ]
    - id: agency.workflow.monitor-proposal.dispatch
      name: dispatch_workflow_monitor_proposal
      display_name: Dispatch Workflow Monitor Proposal
      description: Send one monitor improvement proposal into the main-agent approval conversation so the main agent can review or act on it in context. Use this only after inspecting workflow monitoring events.
