        required: [ workflow_id ]
        additionalProperties: false
      output_schema_name: RESULT_OUTPUT_SCHEMA
      implementation:
        implementation_type: workflow_tool
        target: agency.system.workflow
        callable_name: get_workflow_governance_review_queue
      security: { read_only: true }
      tags: [ system, workflow, governance, review, queue, agent_assignable, read_only ]
    - id: agency.workflow.governance.act
      name: execute_workflow_governance_action
      display_name: Execute Workflow Governance Action
      description: Execute one recommended governance queue action for a workflow. Use this to request approval for a proposal or steering record, attach one uploaded document as evidence, manually resolve or dismiss a record, reopen a manually closed record, or apply deterministic governance remediation.
      tool_type: WORKFLOW_TOOL
      input_schema:
        type: object
        properties:
          workflow_id:
            type: string
            description: ID of the workflow whose governance action should be executed.
          action:
            type: string
            enum: [ request_approval, attach_evidence, resolve, dismiss, reopen, apply_remediation ]
            description: Governance action to execute.
          record_kind:
            type: [ string, "null" ]
            enum: [ improvement_proposal, steering_approval, null ]
            description: Required for request_approval, attach_evidence, resolve, dismiss, and reopen. Identifies which governance record owns the action.
          record_id:
            type: [ string, "null" ]
            description: Required for request_approval, attach_evidence, resolve, dismiss, and reopen. Governance record id returned by the proposal or steering tools.
          document_id:
            type: [ string, "null" ]
            description: Required for attach_evidence. Uploaded document id to link into the governance record.
          label:
            type: [ string, "null" ]
            description: Optional evidence label stored on the workflow document link.
          summary:
            type: [ string, "null" ]
            description: Optional evidence summary stored on the workflow document link.
          linked_by:
            type: [ string, "null" ]
            description: Optional actor label stored on the workflow document link.
          metadata:
            type: [ object, "null" ]
            description: Optional extra metadata for attach_evidence.
            additionalProperties: true
          sync_status_mismatches:
            type: [ boolean, "null" ]
            description: Optional remediation flag used when action is apply_remediation. Defaults to true.
          clear_orphaned_references:
            type: [ boolean, "null" ]
            description: Optional remediation flag used when action is apply_remediation. Defaults to true.
          adopt_orphaned_approvals:
            type: [ boolean, "null" ]
            description: Optional remediation flag used when action is apply_remediation. Defaults to true.
        required: [ workflow_id, action ]
        additionalProperties: false
      output_schema_name: RESULT_OUTPUT_SCHEMA
      implementation:
        implementation_type: workflow_tool
        target: agency.system.workflow
        callable_name: execute_workflow_governance_action
      security: { read_only: false }
      tags: [ system, workflow, governance, action, approval, evidence, remediation, agent_assignable, mutation ]
