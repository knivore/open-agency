      output_schema_name: RESULT_OUTPUT_SCHEMA
      implementation:
        implementation_type: workflow_tool
        target: agency.system.workflow
        callable_name: update_main_agent_monitor_routes
      security:
        read_only: false
      tags: [ system, workflow, governance, monitor, agent_assignable, mutation ]
