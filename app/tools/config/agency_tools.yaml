    description: "Terminate the current headless browser session and release browser resources. Use this when browser work is complete or a workflow needs to reset browser state. Input schema is empty. Output reports termination status. Side effect: closes browser state and invalidates the current page session."
    created_by: "agency"
    owned_by: "agency"
    parameters: { }

system_tools:
  workflow:
    - id: agency.workflow.list
      name: list_workflows
      display_name: List Workflows
      description: List workflows assigned to the deployment that are visible to this agent. Use this before choosing a workflow unless the user gave an exact workflow id. Output includes workflow ids, names, descriptions, runtime adapters, and metadata needed to choose safely.
      tool_type: WORKFLOW_TOOL
      input_schema:
        type: object
        properties: { }
        additionalProperties: false
      output_schema_name: ITEMS_OUTPUT_SCHEMA
      implementation:
        implementation_type: workflow_tool
        target: agency.system.workflow
        callable_name: list_workflows
      security:
        read_only: true
      tags:
        - system
        - workflow
        - agent_assignable
        - read_only
    - id: agency.workflow.get
      name: get_workflow
      display_name: Get Workflow
      description: Get a visible workflow definition by `workflow_id` before planning a run or update. Output includes agents, tasks, tool definitions, graph structure, runtime settings, and metadata.
      tool_type: WORKFLOW_TOOL
      input_schema:
        type: object
        properties:
          workflow_id:
            type: string
            description: ID of a visible workflow.
        required:
          - workflow_id
        additionalProperties: false
      output_schema_name: RESULT_OUTPUT_SCHEMA
      implementation:
        implementation_type: workflow_tool
        target: agency.system.workflow
        callable_name: get_workflow
      security:
        read_only: true
      tags:
        - system
        - workflow
        - agent_assignable
        - read_only
    - id: agency.workflow.run
      name: run_workflow
      display_name: Run Workflow
      description: Run a visible workflow by workflow_id. Call Get Workflow first when inputs are unclear. Protected workflows request human approval before every execution attempt. Output returns execution status, id, and runtime payload for follow-up inspection.
      tool_type: WORKFLOW_TOOL
      input_schema:
        type: object
        properties:
          workflow_id:
            type: string
            description: ID of a visible workflow.
          input_payload:
            type: object
            description: Workflow input payload keyed by the workflow's input_keys or task input_schema properties.
            examples:
              - topic: quarterly launch plan
                audience: internal operators
            additionalProperties: true
          runtime_adapter_id:
            type:
              - string
              - "null"
            description: Optional runtime adapter override.
          goal_id:
            type:
              - string
              - "null"
            description: Optional durable goal id to associate with the created workflow execution.
          conversation_id:
            type:
              - string
              - "null"
            description: Optional conversation id for protected workflow approval requests.
          origin_message_id:
            type:
              - string
              - "null"
            description: Optional existing origin message id for protected workflow approval requests.
        required:
          - workflow_id
        additionalProperties: false
      output_schema_name: WORKFLOW_RUN_OUTPUT_SCHEMA
      implementation:
        implementation_type: workflow_tool
        target: agency.system.workflow
        callable_name: run_workflow
      security:
        read_only: false
      tags:
        - system
        - workflow
        - agent_assignable
    - id: agency.workflow.propose-create
      name: propose_workflow_create
      display_name: Propose New Workflow
      description: Propose creating a workflow. Provide either a complete workflow payload or a natural-language goal. Prefer goal for smaller context windows; the backend workflow builder can draft and repair the payload. This always creates a human approval request before the workflow is persisted.
      tool_type: WORKFLOW_TOOL
      input_schema:
        type: object
        properties:
          summary:
            type: string
            description: Human-readable summary of the workflow proposal.
          diff_summary:
            type:
              - string
              - "null"
            description: Optional concise explanation of the proposed workflow contents.
          goal:
            type: string
            description: Natural-language workflow goal to draft using the existing workflow builder. Use this instead of a full workflow when the required JSON is too large or uncertain.
            examples:
              - Create a workflow that researches a prospect, drafts an outreach email, and asks for approval before sending.
          conversation_history:
            type:
              - string
              - "null"
            description: Optional context for the workflow builder.
          model_profile_id:
            type:
              - string
              - "null"
            description: Optional model profile for workflow builder structured generation.
          restart_active_executions:
            type: boolean
            description: Whether approving this workflow revision should create replacement executions for active runs of the same workflow and cancel/remove their existing containers. Use true only when the update makes active runs stale or unsafe to continue; default false.
          workflow:
            type: object
            description: Complete WorkflowDefinition payload. If validation fails, retry with a smaller goal-based request or include only the corrected sections.
            additionalProperties: true
        additionalProperties: false
      output_schema_name: PROPOSAL_OUTPUT_SCHEMA
      implementation:
        implementation_type: workflow_tool
        target: agency.system.workflow
        callable_name: propose_workflow_create
      security:
        requires_approval: false
      tags:
        - system
        - workflow
        - agent_assignable
        - mutation
    - id: agency.workflow.propose-update
      name: propose_workflow_update
      display_name: Propose Workflow Update
      description: Propose updating a visible, mutable workflow. Provide either a complete updated workflow payload or a natural-language goal. Prefer goal for smaller context windows. This always creates a human approval request before changes are applied.
      tool_type: WORKFLOW_TOOL
      input_schema:
        type: object
        properties:
          workflow_id:
            type: string
            description: ID of the workflow to update.
          summary:
            type: string
            description: Human-readable summary of the proposed update.
          diff_summary:
            type:
              - string
              - "null"
            description: Optional concise explanation of the changed workflow fields.
          goal:
            type: string
            description: Natural-language edit request to apply to the current workflow. Use this when patching a large workflow or when validation repair is likely.
            examples:
              - Add a human approval task before any external email tool is called, and keep the existing agents.
          conversation_history:
            type:
              - string
              - "null"
            description: Optional context for the workflow builder.
          model_profile_id:
            type:
              - string
              - "null"
            description: Optional model profile for workflow builder structured generation.
          workflow:
            type: object
            description: Complete updated WorkflowDefinition payload. If omitted, goal is required. If validation fails, repair only the fields called out by validation rather than regenerating unrelated sections.
            additionalProperties: true
        required:
          - workflow_id
        additionalProperties: false
      output_schema_name: PROPOSAL_OUTPUT_SCHEMA
      implementation:
        implementation_type: workflow_tool
        target: agency.system.workflow
        callable_name: propose_workflow_update
      security:
        requires_approval: false
      tags:
        - system
        - workflow
        - agent_assignable
        - mutation
    - id: agency.schedule.list
      name: list_schedules
      display_name: List Schedules
      description: List workflow schedules before creating, editing, disabling, or manually triggering one. Output includes schedule ids, workflow bindings, trigger configuration, and enabled state so the main agent can reason about orchestration safely.
      tool_type: WORKFLOW_TOOL
      input_schema:
        type: object
        properties:
          workflow_id:
            type: [ string, "null" ]
            description: Optional workflow id to filter schedules.
          enabled:
            type: [ boolean, "null" ]
            description: Optional enabled-state filter.
          limit:
            type: integer
            minimum: 1
            maximum: 200
            description: Maximum number of schedules to return.
        additionalProperties: false
      output_schema_name: ITEMS_OUTPUT_SCHEMA
      implementation:
        implementation_type: workflow_tool
        target: agency.system.workflow
        callable_name: list_schedules
      security:
        read_only: true
      tags: [ system, workflow, schedule, agent_assignable, read_only ]
    - id: agency.schedule.get
      name: get_schedule
      display_name: Get Schedule
      description: Get one workflow schedule by `schedule_id` before patching or triggering it. Output includes the normalized schedule definition and current scheduler metadata.
      tool_type: WORKFLOW_TOOL
      input_schema:
        type: object
        properties:
          schedule_id:
            type: string
            description: ID of the schedule to inspect.
        required: [ schedule_id ]
        additionalProperties: false
      output_schema_name: RESULT_OUTPUT_SCHEMA
      implementation:
        implementation_type: workflow_tool
        target: agency.system.workflow
        callable_name: get_schedule
      security:
        read_only: true
      tags: [ system, workflow, schedule, agent_assignable, read_only ]
    - id: agency.schedule.create
      name: create_schedule
      display_name: Create Schedule
      description: Create a workflow schedule when the user asks the main agent to automate or periodically trigger an existing workflow. Provide a complete schedule payload with workflow_id, trigger settings, and optional input template.
      tool_type: WORKFLOW_TOOL
      input_schema:
        type: object
        properties:
          schedule:
            type: object
            description: Complete ScheduleDefinition payload to create.
            additionalProperties: true
        required: [ schedule ]
        additionalProperties: false
      output_schema_name: RESULT_OUTPUT_SCHEMA
      implementation:
        implementation_type: workflow_tool
        target: agency.system.workflow
        callable_name: create_schedule
      security:
        read_only: false
      tags: [ system, workflow, schedule, agent_assignable, mutation ]
    - id: agency.schedule.update
      name: update_schedule
      display_name: Update Schedule
      description: Patch an existing schedule by `schedule_id` after inspecting it. Use this to change trigger rules, enablement, input templates, or adapter overrides without recreating the schedule from scratch.
      tool_type: WORKFLOW_TOOL
      input_schema:
        type: object
        properties:
          schedule_id:
            type: string
            description: ID of the schedule to patch.
          patch:
            type: object
            description: Partial schedule fields to update.
            additionalProperties: true
        required: [ schedule_id, patch ]
        additionalProperties: false
      output_schema_name: RESULT_OUTPUT_SCHEMA
      implementation:
        implementation_type: workflow_tool
        target: agency.system.workflow
        callable_name: update_schedule
      security:
        read_only: false
      tags: [ system, workflow, schedule, agent_assignable, mutation ]
    - id: agency.schedule.delete
      name: delete_schedule
      display_name: Delete Schedule
      description: Soft-delete a schedule after the user explicitly asks to remove an automation. Use Get Schedule first when there is any ambiguity about the selected schedule id.
      tool_type: WORKFLOW_TOOL
      input_schema:
        type: object
        properties:
          schedule_id:
            type: string
            description: ID of the schedule to delete.
        required: [ schedule_id ]
        additionalProperties: false
      output_schema_name: RESULT_OUTPUT_SCHEMA
      implementation:
        implementation_type: workflow_tool
        target: agency.system.workflow
        callable_name: delete_schedule
      security:
        read_only: false
      tags: [ system, workflow, schedule, agent_assignable, mutation ]
    - id: agency.schedule.trigger-now
      name: trigger_schedule_now
      display_name: Trigger Schedule Now
      description: Manually trigger a workflow schedule immediately when the user wants to fire the configured automation outside its normal cadence. Output includes the created execution id and trigger timestamp.
      tool_type: WORKFLOW_TOOL
      input_schema:
        type: object
        properties:
          schedule_id:
            type: string
            description: ID of the schedule to trigger immediately.
        required: [ schedule_id ]
        additionalProperties: false
      output_schema_name: RESULT_OUTPUT_SCHEMA
      implementation:
        implementation_type: workflow_tool
        target: agency.system.workflow
        callable_name: trigger_schedule_now
      security:
        read_only: false
      tags: [ system, workflow, schedule, agent_assignable, mutation ]
    - id: agency.workflow.runtime-governance.get
      name: get_workflow_runtime_governance
      display_name: Get Workflow Runtime Governance
      description: Read workflow runtime-governance controls before adjusting token budgets, context compaction, or monitor policy. Output normalizes defaults and shows operator actions for follow-up updates.
      tool_type: WORKFLOW_TOOL
      input_schema:
        type: object
        properties:
          workflow_id:
            type: string
            description: ID of the workflow to inspect.
        required: [ workflow_id ]
        additionalProperties: false
      output_schema_name: RESULT_OUTPUT_SCHEMA
      implementation:
        implementation_type: workflow_tool
        target: agency.system.workflow
        callable_name: get_workflow_runtime_governance
      security:
        read_only: true
      tags: [ system, workflow, governance, agent_assignable, read_only ]
    - id: agency.workflow.runtime-governance.update
      name: update_workflow_runtime_governance
      display_name: Update Workflow Runtime Governance
      description: Update one workflow's runtime-governance controls after the user asks to change token budgets or context compaction behavior. Provide only the fields that should change inside `patch`.
      tool_type: WORKFLOW_TOOL
      input_schema:
        type: object
        properties:
          workflow_id:
            type: string
            description: ID of the workflow to update.
          patch:
            type: object
            description: Partial runtime-governance patch with token_budget and context_compaction fields.
            additionalProperties: true
        required: [ workflow_id, patch ]
        additionalProperties: false
      output_schema_name: RESULT_OUTPUT_SCHEMA
      implementation:
        implementation_type: workflow_tool
        target: agency.system.workflow
        callable_name: update_workflow_runtime_governance
      security:
        read_only: false
      tags: [ system, workflow, governance, agent_assignable, mutation ]
    - id: agency.main-agent.monitor.get
      name: get_main_agent_monitor_command_center
      display_name: Get Main Agent Monitor Command Center
      description: Read the main-agent monitoring command center before routing alerts, reviewing findings, or understanding which workflows are monitored, exempt, strict, or waiting on approval.
      tool_type: WORKFLOW_TOOL
      input_schema:
        type: object
        properties: { }
        additionalProperties: false
      output_schema_name: RESULT_OUTPUT_SCHEMA
      implementation:
        implementation_type: workflow_tool
        target: agency.system.workflow
        callable_name: get_main_agent_monitor_command_center
      security:
        read_only: true
      tags: [ system, workflow, governance, monitor, agent_assignable, read_only ]
    - id: agency.main-agent.monitor.update-routes
      name: update_main_agent_monitor_routes
      display_name: Update Main Agent Monitor Routes
      description: Update approval conversation routing, delivery options, or monitor-notification settings after the user changes where main-agent monitor findings and proposals should go.
      tool_type: WORKFLOW_TOOL
      input_schema:
        type: object
        properties:
          patch:
