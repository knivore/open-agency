app_tools:
  agency.human.ask:
    id: "agency.human.ask"
    name: "ask_human"
    display_name: "Ask Human"
    description: "Ask the human operator a focused question when execution is blocked, approval context is missing, or the agent needs a decision that cannot be inferred safely. Use this for clarification, not for routine status updates. Required input: `query`, the exact question to show. Optional runtime inputs may include `process_id` and `timeout`. Output reports whether a response was received or the request timed out. Side effect: pauses automation while waiting for the human reply."
    created_by: "agency"
    owned_by: "agency"
    parameters:
      query:
        mandatory: true
        type: "string"
        filled_by: "agent"
        description: "Exact question to ask the human operator."
      process_id:
        mandatory: false
        type: "string"
        filled_by: "agent"
        input_type: "hidden"
        description: "Optional run or process channel used to route the question and reply."
      timeout_seconds:
        mandatory: false
        type: "integer"
        filled_by: "user_or_agent"
        description: "Maximum number of seconds to wait for the human reply. Defaults to 60."

  agency.speech.listen:
    id: "agency.speech.listen"
    name: "listen_speech"
    display_name: "Listen Speech"
    description: "Listen to recorded audio and transcribe it into text with Agency's shared speech input capability. Use this when an agent receives an audio file, voice-note chunk, or base64 audio payload and needs normalized text before planning or tool use. Required input: exactly one of `file_path` or `audio_base64`. Optional inputs: `filename`, `model`, `language`, `prompt`, and `response_format`. Defaults to `whisper-1`, or `OPENAI_AUDIO_TRANSCRIPTION_MODEL` when configured. Side effect: sends audio to the configured speech-to-text provider."
    created_by: "agency"
    owned_by: "agency"
    tags: [ "catalog", "speech", "agent_assignable", "risk:low" ]
    parameters:
      file_path:
        mandatory: false
        type: "string"
        filled_by: "agent"
        description: "Path to a local audio file accessible to the backend."
      audio_base64:
        mandatory: false
        type: "string"
        filled_by: "agent"
        description: "Base64 encoded audio bytes. Data URLs are accepted."
      filename:
        mandatory: false
        type: "string"
        filled_by: "agent"
        description: "Filename to use when `audio_base64` is provided. Defaults to `audio.webm`."
      model:
        mandatory: false
        type: "string"
        filled_by: "user_or_agent"
        description: "OpenAI speech-to-text model such as `whisper-1` or `gpt-4o-mini-transcribe`."
      language:
        mandatory: false
        type: "string"
        filled_by: "user_or_agent"
        description: "Optional ISO-639-1 language hint such as `en`."
      prompt:
        mandatory: false
        type: "string"
        filled_by: "user_or_agent"
        description: "Optional prompt or keyword list to guide transcription."
      response_format:
        mandatory: false
        type: "string"
        filled_by: "user_or_agent"
        description: "Response format: `json`, `text`, or `verbose_json`. Defaults to `json`."

  agency.speech.speak:
    id: "agency.speech.speak"
    name: "speak_speech"
    display_name: "Speak Speech"
    description: "Create a generic Agency speech output request that downstream surfaces such as speakers, phones, or ambient devices can deliver. Use this when a workflow needs spoken output without binding itself to one vendor-specific text-to-speech stack. Required input: `text`. Optional inputs: `targetKind`, `targetRef`, `channel`, `ssml`, `voice`, and `metadata`."
    created_by: "agency"
    owned_by: "agency"
    tags: [ "catalog", "speech", "agent_assignable", "risk:low" ]
    parameters:
      text:
        mandatory: true
        type: "string"
        filled_by: "agent"
        description: "Announcement text to deliver."
      targetKind:
        mandatory: false
        type: "string"
        filled_by: "user_or_agent"
        description: "Optional target scope such as `home`, `room`, `speaker`, or `surface`."
      targetRef:
        mandatory: false
        type: "string"
        filled_by: "user_or_agent"
        description: "Optional target entity, room, or surface reference."
      channel:
        mandatory: false
        type: "string"
        filled_by: "user_or_agent"
        description: "Optional delivery channel label such as `voice` or `phone`."
      ssml:
        mandatory: false
        type: "string"
        filled_by: "agent"
        description: "Optional SSML payload for downstream speech adapters that support it."
      voice:
        mandatory: false
        type: "string"
        filled_by: "user_or_agent"
        description: "Optional voice preset or provider-specific voice id."
      metadata:
        mandatory: false
        type: "object"
        filled_by: "agent"
        description: "Optional delivery metadata for downstream adapters and audit context."

  agency.speech.continue:
    id: "agency.speech.continue"
    name: "continue_speech"
    display_name: "Continue Speech"
    description: "Continue a generic Agency speech conversation from a follow-up spoken response. Use this when an announcement or prompt expects the user to answer verbally and the workflow should resume through Agency's shared speech surface. Required input: `responseText`. Optional inputs: `surface`, `sessionId`, `priorAnnouncementId`, `channel`, and `metadata`."
    created_by: "agency"
    owned_by: "agency"
    tags: [ "catalog", "speech", "agent_assignable", "risk:medium" ]
    parameters:
      responseText:
        mandatory: true
        type: "string"
        filled_by: "agent"
        description: "The follow-up spoken response to continue from."
      surface:
        mandatory: false
        type: "string"
        filled_by: "user_or_agent"
        description: "Surface where the response was captured, such as `speaker` or `phone`."
      sessionId:
        mandatory: false
        type: "string"
        filled_by: "user_or_agent"
        description: "Optional session identifier for the existing speech conversation."
      priorAnnouncementId:
        mandatory: false
        type: "string"
        filled_by: "user_or_agent"
        description: "Optional announcement id that prompted the response."
      channel:
        mandatory: false
        type: "string"
        filled_by: "user_or_agent"
        description: "Optional channel label such as `voice` or `phone`."
      metadata:
        mandatory: false
        type: "object"
        filled_by: "agent"
        description: "Optional continuation metadata forwarded to downstream speech handlers."

  agency.voice.generate:
    id: "agency.voice.generate"
    name: "generate_voice"
    display_name: "Generate Voice"
    description: "Generate a local-first spoken audio file from text, publish it into Agency storage, and return a reusable voice artifact with file_path, storage_key, storage_uri, and media_url. provider=system_tts uses the host TTS engine; provider=openvoice_local uses Agency's local OpenVoice checkout. OpenVoice uses its built-in friendly voice when no reference is supplied, or clones a consented reference when reference_voice_path and consent_confirmed=true are provided. Required inputs: text and ai_disclosure=true. Delivery is intentionally separate so workflows can route the generated voice to any tied application or downstream tool."
    created_by: "agency"
    owned_by: "agency"
    tags: [ "catalog", "voice", "speech", "media", "storage", "agent_assignable", "risk:medium" ]
    security:
      requires_approval: false
      allow_network: false
      allowlisted_domains: []
      redaction_enabled: false
    parameters:
      text:
        mandatory: true
        type: "string"
        filled_by: "agent"
        description: "Text to synthesize into spoken audio."
      provider:
        mandatory: false
        type: "string"
        filled_by: "user_or_agent"
        default: "auto"
        description: "Voice provider: auto, openvoice_local, or system_tts. auto uses openvoice_local when a consented reference_voice_path is supplied, otherwise system_tts."
      voice:
        mandatory: false
        type: "string"
        filled_by: "user_or_agent"
        description: "Optional local OS voice name or provider-specific voice preset."
      reference_voice_path:
        mandatory: false
        type: "string"
        filled_by: "user_or_agent"
        description: "Optional reference voice path for Agency's local OpenVoice cloning. Omit it to use the built-in friendly voice."
      output_name:
        mandatory: false
        type: "string"
        filled_by: "agent"
        description: "Optional relative output filename or storage-key suffix."
      storage_key_prefix:
        mandatory: false
        type: "string"
        filled_by: "agent"
        default: "voice"
        description: "Agency storage prefix for generated audio."
      purpose:
        mandatory: false
        type: "string"
        filled_by: "agent"
        description: "Human-readable purpose for audit and policy review."
      ai_disclosure:
        mandatory: true
        type: "boolean"
        filled_by: "user_or_agent"
        description: "Must be true so generated speech can be disclosed as AI-generated when delivered."
      consent_confirmed:
        mandatory: false
        type: "boolean"
        filled_by: "user_or_agent"
        default: false
        description: "Must be true when a reference or cloned voice provider is used."
      dry_run:
        mandatory: false
        type: "boolean"
        filled_by: "user_or_agent"
        default: true
        description: "When true, preview provider, guardrails, and storage target without synthesis."
      metadata:
        mandatory: false
        type: "object"
        filled_by: "agent"
        description: "Optional workflow or delivery metadata."

  agency.media.publish:
    id: "agency.media.publish"
    name: "publish_media"
    display_name: "Publish Media"
    description: "Copy a local image, audio, voice, video, or document file into Agency storage and return a reusable media artifact with storage_uri and media_url. Use this when any producing tool returns a local file path and a workflow needs a shared artifact for later steps, delivery, audit, or reuse. Required input: `file_path`. Optional inputs choose the storage key, filename, MIME type, overwrite behavior, dry-run preview, and workflow metadata. Local development URLs may not be fetchable by external providers unless the Agency API is exposed."
    created_by: "agency"
    owned_by: "agency"
    tags: [ "catalog", "media", "storage", "delivery", "agent_assignable", "risk:medium" ]
    parameters:
      file_path:
        mandatory: true
        type: "string"
        filled_by: "agent"
        description: "Local media file path to copy into Agency storage."
      storage_key:
        mandatory: false
        type: "string"
        filled_by: "agent"
        description: "Optional exact storage key. When omitted, a unique key is generated under storage_key_prefix."
      storage_key_prefix:
        mandatory: false
        type: "string"
        filled_by: "agent"
        default: "media"
        description: "Storage key prefix used when storage_key is omitted."
      filename:
        mandatory: false
        type: "string"
        filled_by: "agent"
        description: "Optional filename for generated storage keys."
      content_type:
        mandatory: false
        type: "string"
        filled_by: "agent"
        description: "Optional MIME type. When omitted, Agency guesses it from the filename."
      overwrite:
        mandatory: false
        type: "boolean"
        filled_by: "user_or_agent"
        default: false
        description: "Whether to replace an existing object at storage_key."
      dry_run:
        mandatory: false
        type: "boolean"
        filled_by: "user_or_agent"
        default: true
        description: "When true, preview the storage key and URL without copying the file."
      metadata:
        mandatory: false
        type: "object"
        filled_by: "agent"
        description: "Optional audit or workflow metadata."

  agency.media.send:
    id: "agency.media.send"
    name: "send_media"
    display_name: "Send Media"
    description: "Build or send a provider-specific media message through Agency's shared delivery boundary for any supported tied application. It accepts media produced by voice generation, image/video/document tools, storage, or any workflow step. Required inputs: `provider`, `media_type`, and one of `media_url` or `file_path`. Real delivery requires `dry_run=false`, `credential_id`, `owner_user_id`, and a destination; most providers require a provider-fetchable media_url, while providers with upload adapters may accept file_path directly."
    created_by: "agency"
    owned_by: "agency"
    tags: [ "catalog", "media", "delivery", "agent_assignable", "risk:medium" ]
    security:
      requires_approval: false
    parameters:
      provider:
        mandatory: true
        type: "string"
        filled_by: "user_or_agent"
        description: "Delivery provider: telegram, discord, slack, microsoft-teams, or whatsapp."
      media_type:
        mandatory: true
        type: "string"
        filled_by: "user_or_agent"
        description: "Media kind: image, audio, voice, video, or document."
      media_url:
        mandatory: false
        type: "string"
        filled_by: "agent"
        description: "Provider-fetchable media URL. Required for real delivery."
      file_path:
        mandatory: false
        type: "string"
        filled_by: "agent"
        description: "Local media file path for preview/provenance. Host it before real provider delivery."
      text:
        mandatory: false
        type: "string"
        filled_by: "agent"
        description: "Optional message text sent with or near the media."
      caption:
        mandatory: false
        type: "string"
        filled_by: "agent"
        description: "Optional media caption."
      filename:
        mandatory: false
        type: "string"
        filled_by: "agent"
        description: "Optional filename for document-style media."
      mime_type:
        mandatory: false
        type: "string"
        filled_by: "agent"
        description: "Optional MIME type for audit and downstream adapters."
      destination_id:
        mandatory: false
        type: "string"
        filled_by: "user_or_agent"
        description: "Provider destination id such as Telegram chat id, Discord/Slack/Teams channel id, or WhatsApp recipient."
      team_id:
        mandatory: false
        type: "string"
        filled_by: "user_or_agent"
        description: "Microsoft Teams team id when provider is microsoft-teams."
      credential_id:
        mandatory: false
        type: "string"
        filled_by: "user_or_agent"
        description: "Agency credential or connector installation id for real delivery."
      owner_user_id:
        mandatory: false
        type: "string"
        filled_by: "user_or_agent"
        description: "Owner user id used to resolve the credential for real delivery."
      dry_run:
        mandatory: false
        type: "boolean"
        filled_by: "user_or_agent"
        default: true
        description: "When true, build and return the provider payload without sending."
      metadata:
        mandatory: false
        type: "object"
        filled_by: "agent"
        description: "Optional audit or workflow metadata."

  agency.http.request:
    id: "agency.http.request"
    name: "send_http_request"
    display_name: "Send HTTP Request"
    description: "Send one HTTP request to an explicit URL when an agent needs to call an external API or webhook. Use this only for APIs that are expected by the workflow and whose domain is allowed by the tool security policy. Required inputs: `url` and `method`. Optional inputs: `headers`, `query_params`, `body`, `verify_ssl`, and `credential_mode`. Output includes the HTTP status code and parsed response body when JSON is returned. Side effect: performs a network call and may mutate external systems depending on the HTTP method."
    created_by: "agency"
    owned_by: "agency"
    security:
      requires_approval: false
    parameters:
      url:
        mandatory: true
        type: "string"
        filled_by: "user_or_agent"
        description: "Absolute API endpoint URL to call."
      method:
        mandatory: true
        type: "string"
        filled_by: "user_or_agent"
        description: "HTTP method such as GET, POST, PUT, PATCH, or DELETE."
      headers:
        mandatory: false
        type: "object"
        filled_by: "user_or_agent"
        description: "Optional request headers. Do not embed secrets directly; use configured credentials where available."
      query_params:
        mandatory: false
        type: "object"
        filled_by: "user_or_agent"
        description: "Optional query-string parameters."
      body:
        mandatory: false
        type: "object"
        filled_by: "user_or_agent"
        description: "Optional JSON request body."
      verify_ssl:
        mandatory: false
        type: "boolean"
        filled_by: "user_or_agent"
        description: "Whether TLS certificates should be verified. Defaults to true."
      credential_mode:
        mandatory: false
        type: "string"
        filled_by: "user_or_agent"
        description: "Credential handling mode. Use `onecli` to route through the OneCLI gateway without exposing raw credentials."

  agency.document.markdown-to-word:
    id: "agency.document.markdown-to-word"
    name: "convert_markdown_to_word"
    display_name: "Convert Markdown to Word"
    description: "Convert markdown text into a Word document and upload the generated `.docx` file to configured storage. Use this when the agent has final markdown content that should become a downloadable Word artifact. Required inputs: `markdown_text`, `filename`, and `img_directory`. Output is a storage location or error message. Side effect: writes a temporary document and uploads a file artifact."
    created_by: "agency"
    owned_by: "agency"
    parameters:
      markdown_text:
        mandatory: true
        type: "string"
        filled_by: "agent"
        description: "Markdown-formatted document body to convert."
      filename:
        mandatory: true
        type: "string"
        filled_by: "user_or_agent"
        description: "Output Word filename, including `.docx` when desired."
      img_directory:
        mandatory: true
        type: "string"
        cloud_directory: true
        input_type: "hidden"
        filled_by: "agent"
        description: "Storage directory or workflow artifact path for the generated document."

  agency.file.write-text:
    id: "agency.file.write-text"
    name: "write_text_file"
    display_name: "Write Text File"
    description: "Write or append text content to a file under an allowed base folder. Use this for workflow artifacts and controlled local text outputs, not for editing source code or credential files. Required inputs: `base_folder`, `content`, and `mode`. Optional input: `filename`; if omitted, the configured default filename is used. Output includes status, message, and full path. Side effect: creates or modifies a file and requires filesystem permission."
    created_by: "agency"
    owned_by: "agency"
    security:
      requires_approval: false
    parameters:
      base_folder:
        mandatory: true
        type: "string"
        filled_by: "user"
        description: "Allowed directory where the file will be written."
      content:
        mandatory: true
        type: "string"
        filled_by: "agent"
        description: "Text content to write or append."
      mode:
        mandatory: true
        type: "string"
        filled_by: "agent"
        description: "Write mode: `write` replaces the file, `append` adds to the end."
      filename:
        mandatory: false
        type: "string"
        filled_by: "agent"
        description: "Optional file name under `base_folder`."

  agency.repo.inspect:
    id: "agency.repo.inspect"
    name: "inspect_repo"
    display_name: "Inspect Repo"
    description: "Inspect an allowlisted git repository without using the approval-gated shell tool. Use this for recurring learning, architecture review, TODO discovery, docs inspection, and read-only product or engineering coaching. Required input: `repo`, using a repo alias like `agency` or `agency-fe`, or an allowlisted absolute path. Optional inputs narrow the scan with `query`, `focus_paths`, `include_patterns`, `exclude_patterns`, `max_files`, `max_hits`, and `excerpt_line_limit`. Output includes branch, status, recent commits, TODO hits, query hits, scanned files, and concise file excerpts. Side effect: reads files and git metadata from an allowlisted local repository."
    created_by: "agency"
    owned_by: "agency"
    parameters:
      repo:
        mandatory: true
        type: "string"
        filled_by: "user"
        description: "Repository alias or allowlisted absolute path."
      query:
        mandatory: false
        type: "string"
        filled_by: "agent"
        description: "Optional case-insensitive text to search for in files."
      focus_paths:
        mandatory: false
        type: "array"
        filled_by: "agent"
        description: "Optional repo-relative files or glob patterns to prioritize."
      include_patterns:
        mandatory: false
        type: "array"
        filled_by: "agent"
        description: "Optional repo-relative glob patterns to include."
      exclude_patterns:
        mandatory: false
        type: "array"
        filled_by: "agent"
        description: "Optional repo-relative glob patterns to exclude."
      max_files:
        mandatory: false
        type: "integer"
        filled_by: "user_or_agent"
        description: "Maximum number of files to scan."
      max_hits:
        mandatory: false
        type: "integer"
        filled_by: "user_or_agent"
        description: "Maximum number of TODO or query hits to return."
      excerpt_line_limit:
        mandatory: false
        type: "integer"
        filled_by: "user_or_agent"
        description: "Maximum number of lines to include per file excerpt."

  agency.excel.write-image:
    id: "agency.excel.write-image"
    name: "excel_write_image"
    display_name: "Excel Write Image"
    description: "Embed one screenshot or image into an Excel worksheet for test evidence, visual reports, or audit artifacts. Required inputs: `sheet_name`, `excel_file_path`, `image_path`, and `serial_number`. Optional input: `header_title`. Output reports success or the specific workbook/sheet/file error. Side effect: modifies the target workbook while holding a file lock."
    created_by: "agency"
    owned_by: "agency"
    parameters:
      sheet_name:
        mandatory: true
        type: "string"
        filled_by: "user_or_agent"
        description: "Worksheet name to update."
      excel_file_path:
        mandatory: true
        type: "string"
        filled_by: "user"
        description: "Allowlisted workbook path to modify."
      image_path:
        mandatory: true
        type: "string"
        filled_by: "agent"
        description: "Runtime-generated image path to embed."
      serial_number:
        mandatory: true
        type: "integer"
        filled_by: "agent"
        description: "Row offset or test-case serial number for placement."
      header_title:
        mandatory: false
        type: "string"
        filled_by: "user_or_agent"
        description: "Optional column header title."

  agency.excel.write-json:
    id: "agency.excel.write-json"
    name: "excel_write_json"
    display_name: "Excel Write JSON"
    description: "Read a JSON file and write its keys and values into an Excel worksheet row for structured test or workflow output. Required inputs: `sheet_name`, `excel_file_path`, `json_file_path`, and `serial_number`. Output reports success or the specific JSON/workbook/sheet error. Side effect: modifies the target workbook while holding a file lock."
    created_by: "agency"
    owned_by: "agency"
    parameters:
      sheet_name:
        mandatory: true
        type: "string"
        filled_by: "user_or_agent"
        description: "Worksheet name to update."
      excel_file_path:
        mandatory: true
        type: "string"
        filled_by: "user"
        description: "Allowlisted workbook path to modify."
      json_file_path:
        mandatory: true
        type: "string"
        filled_by: "agent"
        description: "Runtime-generated JSON file path to read."
      serial_number:
        mandatory: true
        type: "integer"
        filled_by: "agent"
        description: "Row offset or test-case serial number for placement."

  agency.excel.write-text:
    id: "agency.excel.write-text"
    name: "excel_write_text"
    display_name: "Excel Write Text"
    description: "Read a text file and insert its content into an Excel worksheet row for test evidence, logs, or generated narrative output. Required inputs: `sheet_name`, `excel_file_path`, `text_file_path`, and `serial_number`. Optional input: `header_title`. Output reports success or the specific text/workbook/sheet error. Side effect: modifies the target workbook while holding a file lock."
    created_by: "agency"
    owned_by: "agency"
    parameters:
      sheet_name:
        mandatory: true
        type: "string"
        filled_by: "user_or_agent"
        description: "Worksheet name to update."
      excel_file_path:
        mandatory: true
        type: "string"
        filled_by: "user"
        description: "Allowlisted workbook path to modify."
      text_file_path:
        mandatory: true
        type: "string"
        filled_by: "agent"
        description: "Runtime-generated text file path to read."
      serial_number:
        mandatory: true
        type: "integer"
        filled_by: "agent"
        description: "Row offset or test-case serial number for placement."
      header_title:
        mandatory: false
        type: "string"
        filled_by: "user_or_agent"
        description: "Optional column header title."

  agency.browser.open:
    id: "agency.browser.open"
    name: "open_browser"
    display_name: "Open Browser"
    description: "Start or reuse a Playwright browser session and navigate to a URL. Use this before screenshot, click, type, select, scroll, extract, or verify browser tools. Optional inputs configure HTTP auth, user agent, browser type, mobile mode, locale, timezone, storage state, video recording, tracing, and extra headers. Output includes navigation status and browser artifacts. Side effect: creates browser session state and may load remote web content."
    created_by: "agency"
    owned_by: "agency"
    parameters:
      url:
        mandatory: false
        type: "string"
        filled_by: "user_or_agent"
        description: "URL to open. If omitted, the tool may initialize the browser without navigation."
      http_credentials_username:
        mandatory: false
        type: "string"
        filled_by: "user_or_agent"
        description: "Optional HTTP basic-auth username."
      http_credentials_password:
        mandatory: false
        type: "string"
        filled_by: "user_or_agent"
        description: "Optional HTTP basic-auth password."
      user_agent:
        mandatory: false
        type: "string"
        filled_by: "user_or_agent"
        description: "Optional custom browser user agent."
      browser_type:
        mandatory: false
        type: "string"
        filled_by: "user_or_agent"
        description: "Optional browser family to emulate, such as chrome, firefox, safari, or edge."
      mobile:
        mandatory: false
        type: "boolean"
        filled_by: "user_or_agent"
        description: "Whether to use mobile viewport and user-agent behavior."
      locale:
        mandatory: false
        type: "string"
        filled_by: "user_or_agent"
        description: "Optional browser locale, for example en-US."
      timezone_id:
        mandatory: false
        type: "string"
        filled_by: "user_or_agent"
        description: "Optional browser timezone, for example Asia/Singapore."
      storage_state_path:
