system_families:
  - key: workflow
    policy_flag: can_trigger_workflows
    default_enabled: true
    include_in_builtin_registry: true

  - key: goal
    policy_flag: can_manage_goals
    default_enabled: true
    include_in_builtin_registry: true

  - key: tool_management
    policy_flag: can_manage_tools
    default_enabled: true
    include_in_builtin_registry: true

  - key: agent_management
    policy_flag: can_manage_agents
    default_enabled: true
    include_in_builtin_registry: true

  - key: connector
    policy_flag: can_manage_integrations
    default_enabled: true
    include_in_builtin_registry: false

  - key: memory
    policy_flag: can_manage_memory
    default_enabled: true
    include_in_builtin_registry: true

  - key: graph
    policy_flag: can_read_graph_context
    default_enabled_setting: agency_graph_context_tools_enabled
    include_in_builtin_registry: true

  - key: execution
    policy_flag: can_inspect_executions
    default_enabled: true
    include_in_builtin_registry: true

  - key: command
    policy_flag: can_run_commands
    default_enabled: true
    include_in_builtin_registry: true
