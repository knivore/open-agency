      description: Get one tool definition by `tool_id`. Use this before planning an update, assigning the tool to an agent, or explaining a tool's inputs. Output returns the full ToolDefinition including input schema, output schema, implementation target, security settings, MCP exposure, and tags.
      tool_type: WORKFLOW_TOOL
