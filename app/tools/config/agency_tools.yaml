  agency.browser.screenshot:
    id: "agency.browser.screenshot"
    name: "take_screenshot"
    display_name: "Take Screenshot"
    description: "Capture a screenshot of the current browser page. Use this after opening or interacting with a page when the agent needs visual evidence or a page-state artifact. Optional input: `full_page_screenshot`. Output includes screenshot artifact metadata. Side effect: writes a screenshot artifact."
