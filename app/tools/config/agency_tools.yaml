        - agent_assignable
        - read_only
    - id: agency.tool.propose-create
      name: propose_tool_create
      display_name: Propose New Tool
      description: Propose creating a new tool definition. Use this only when the user asks for a new capability and you can provide a complete ToolDefinition payload. The backend validates the payload and creates a human approval request before persistence. The payload must include the full implementation object and keep security fields nested under security.* (for example security.read_only). Do not use this to execute a tool.
      tool_type: WORKFLOW_TOOL
      input_schema:
        type: object
        properties:
          summary:
            type: string
            description: Human-readable summary of the proposed tool.
          diff_summary:
            type:
              - string
              - "null"
            description: Optional concise explanation of what will be added.
          tool:
            type: object
            description: Complete ToolDefinition payload, including implementation.target and implementation.implementation_type.
            additionalProperties: true
        required:
          - tool
        additionalProperties: false
      output_schema_name: PROPOSAL_OUTPUT_SCHEMA
      implementation:
        implementation_type: workflow_tool
        target: agency.system.tool
        callable_name: propose_tool_create
      security:
        requires_approval: false
      tags:
        - system
        - tool_management
        - agent_assignable
        - mutation
    - id: agency.tool.propose-update
      name: propose_tool_update
      display_name: Propose Tool Update
      description: Propose updating an existing tool definition. Use Get Tool first when the current definition is not already in context. If page context identifies the selected tool, tool_id may be omitted. Provide either a complete updated ToolDefinition, a partial patch, or a supported plain-language goal such as renaming the tool or changing its description. The backend validates the proposed ToolDefinition and creates a human approval request before any change is applied. Keep security fields nested under security.* and include a complete implementation object when sending a full ToolDefinition. Do not use this for runtime execution.
      tool_type: WORKFLOW_TOOL
      input_schema:
        type: object
        properties:
          tool_id:
            type:
              - string
              - "null"
            description: ID of the existing tool to update. Optional when page context selects a tool.
          summary:
            type: string
            description: Human-readable summary of the proposed update.
          diff_summary:
            type:
              - string
              - "null"
            description: Optional concise explanation of the changed fields.
          goal:
            type:
              - string
              - "null"
            description: Plain-language update goal, such as renaming the selected tool or changing its description.
          patch:
            type:
              - object
              - "null"
            description: Partial ToolDefinition patch. Supported keys include name, display_name, description, schemas, security, MCP exposure, tags, and framework_hints.
            additionalProperties: true
          tool:
            type:
              - object
              - "null"
            description: Complete updated ToolDefinition payload.
            additionalProperties: true
        required: [ ]
        additionalProperties: false
      output_schema_name: PROPOSAL_OUTPUT_SCHEMA
      implementation:
        implementation_type: workflow_tool
        target: agency.system.tool
        callable_name: propose_tool_update
