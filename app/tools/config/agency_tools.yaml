    - id: agency.tool.workspace.publish
      name: publish_generated_tool_definition
      display_name: Publish Generated Tool Definition
      description: Register or update one ToolDefinition backed by a callable inside a generated tool package. Use this after the coder agent implements the package code and wants other agents or personas to grant and use the tool.
      tool_type: WORKFLOW_TOOL
      input_schema:
        type: object
