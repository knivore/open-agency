      display_name: Execute Workflow Governance Bundle
      description: Execute one guarded governance workflow for a single proposal or steering record by suggesting evidence, optionally attaching the top document match, and optionally requesting approval. Use dry_run first when the main agent needs to preview whether attachable evidence is available.
      tool_type: WORKFLOW_TOOL
      input_schema:
        type: object
        properties:
          workflow_id:
            type: string
            description: ID of the workflow that owns the governance record.
          record_kind:
            type: string
            enum: [ improvement_proposal, steering_approval ]
            description: Governance record family that should receive the bundled action.
          record_id:
            type: string
            description: Governance record id returned by the proposal or steering tools.
          attach_top_suggestion:
            type: [ boolean, "null" ]
            description: When true, attach the highest ranked suggested document before any approval request. Defaults to true.
          request_approval:
            type: [ boolean, "null" ]
            description: When true, request approval after any optional evidence attachment. Defaults to true.
          document_limit:
            type: [ integer, "null" ]
            description: Optional maximum number of candidate documents to inspect when ranking suggestions. Defaults to 5 and caps at 20.
          evidence_label:
            type: [ string, "null" ]
            description: Optional label stored on the attached workflow document link when attach_top_suggestion is enabled.
          evidence_summary:
            type: [ string, "null" ]
            description: Optional summary stored on the attached workflow document link when attach_top_suggestion is enabled.
          metadata:
            type: [ object, "null" ]
            description: Optional metadata stored on the attached workflow document link when attach_top_suggestion is enabled.
            additionalProperties: true
          dry_run:
            type: [ boolean, "null" ]
            description: When true, preview the bundle plan without mutating workflow state.
        required: [ workflow_id, record_kind, record_id ]
        additionalProperties: false
      output_schema_name: RESULT_OUTPUT_SCHEMA
      implementation:
        implementation_type: workflow_tool
        target: agency.system.workflow
        callable_name: execute_workflow_governance_bundle
      security: { read_only: false }
      tags: [ system, workflow, governance, bundle, evidence, approval, agent_assignable, mutation ]
