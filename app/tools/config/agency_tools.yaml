  goal:
    - id: agency.goal.list
      name: list_goals
      display_name: List Goals
      description: List durable Agency goals for long-running autonomous work, with optional filters for status, parent goal, and active-only state. Use this before choosing a goal to inspect, update, supervise, or link to workflow execution.
      tool_type: WORKFLOW_TOOL
      input_schema:
        type: object
        properties:
          status:
            type: [ string, "null" ]
            description: Optional goal status filter such as active, paused, completed, failed, or cancelled.
          parent_goal_id:
            type: [ string, "null" ]
            description: Optional parent goal id used to list only subgoals under one durable goal.
          active_only:
            type: boolean
            default: false
            description: Whether to restrict results to goals that are not terminal.
        additionalProperties: false
      output_schema_name: ITEMS_OUTPUT_SCHEMA
      implementation:
        implementation_type: workflow_tool
        target: agency.system.goal
        callable_name: list_goals
      security:
        read_only: true
      tags: [ system, goal, agent_assignable, read_only ]
    - id: agency.goal.get
      name: get_goal
      display_name: Get Goal
      description: Get a durable goal by goal_id before planning, steering, evaluating completion, or launching linked workflow work. Output includes objective, status, constraints, success criteria, evidence, evaluation, and linked executions.
      tool_type: WORKFLOW_TOOL
      input_schema:
        type: object
        properties:
          goal_id:
            type: string
            description: ID of the durable goal to inspect.
        required: [ goal_id ]
        additionalProperties: false
      output_schema_name: RESULT_OUTPUT_SCHEMA
      implementation:
        implementation_type: workflow_tool
        target: agency.system.goal
        callable_name: get_goal
      security:
        read_only: true
      tags: [ system, goal, agent_assignable, read_only ]
    - id: agency.goal.create
      name: create_goal
      display_name: Create Goal
      description: Create a durable goal that can outlive a single workflow execution. Use this when the user asks Agency to work toward an objective over time, coordinate subagents, or preserve success criteria and constraints.
      tool_type: WORKFLOW_TOOL
      input_schema:
        type: object
        properties:
          objective:
            type: string
            description: Plain-language objective the durable goal should work toward.
          priority:
            type: string
            default: normal
            description: Goal priority label such as low, normal, high, or urgent.
          parent_goal_id:
            type: [ string, "null" ]
            description: Optional parent goal id when creating a subgoal.
          success_criteria:
            type: array
            items:
              type: object
              additionalProperties: true
            description: Structured criteria that should be true before the goal can be completed.
          constraints:
            type: object
            description: Structured constraints such as autonomy posture, allowed tools, blocked tools, risk level, budget, or deadline policy.
            additionalProperties: true
          metadata:
            type: object
            description: Additional operator or agent metadata to keep with the goal.
            additionalProperties: true
        required: [ objective ]
        additionalProperties: false
      output_schema_name: RESULT_OUTPUT_SCHEMA
      implementation:
        implementation_type: workflow_tool
        target: agency.system.goal
        callable_name: create_goal
      security:
        read_only: false
        requires_approval: true
      tags: [ system, goal, agent_assignable, mutation, approval ]
    - id: agency.goal.update
      name: update_goal
      display_name: Update Goal
      description: Update a durable goal's objective, status, priority, success criteria, constraints, evidence, evaluation, deadline, or metadata. Use this to refine goal state after new information or supervisor review.
      tool_type: WORKFLOW_TOOL
      input_schema:
        type: object
        properties:
          goal_id:
            type: string
            description: ID of the durable goal to update.
          patch:
            type: object
            description: Goal fields to update using the backend goal API shape.
            additionalProperties: true
        required: [ goal_id, patch ]
        additionalProperties: false
      output_schema_name: RESULT_OUTPUT_SCHEMA
      implementation:
        implementation_type: workflow_tool
        target: agency.system.goal
        callable_name: update_goal
      security:
        read_only: false
        requires_approval: true
      tags: [ system, goal, agent_assignable, mutation, approval ]
    - id: agency.goal.plan
      name: plan_goal
      display_name: Plan Goal
      description: Create or replace the initial active plan for a durable goal. Use this to turn a goal into structured executable, inspection, input, approval, memory, or evaluation steps before autonomous supervision continues.
      tool_type: WORKFLOW_TOOL
      input_schema:
        type: object
        properties:
          goal_id:
            type: string
            description: ID of the durable goal to plan.
          plan:
            type: [ object, "null" ]
            description: Optional structured plan. If omitted, Agency creates a conservative default plan from goal constraints and success criteria.
            additionalProperties: true
          reason:
            type: string
            default: initial_plan
            description: Reason this plan is being created.
        required: [ goal_id ]
        additionalProperties: false
      output_schema_name: RESULT_OUTPUT_SCHEMA
      implementation:
        implementation_type: workflow_tool
        target: agency.system.goal
        callable_name: plan_goal
      security:
        read_only: false
        requires_approval: true
      tags: [ system, goal, agent_assignable, mutation, approval ]
    - id: agency.goal.replan
      name: replan_goal
      display_name: Replan Goal
      description: Version a durable goal's active plan after failure, stale work, missing evidence, or operator steering. Use this when the main agent needs to change next actions while preserving the previous plan history.
      tool_type: WORKFLOW_TOOL
      input_schema:
        type: object
        properties:
          goal_id:
            type: string
            description: ID of the durable goal to replan.
          plan:
            type: [ object, "null" ]
            description: Optional replacement structured plan. If omitted, Agency creates a conservative default plan from the current goal.
            additionalProperties: true
          reason:
            type: string
            description: Required explanation for why the active goal plan is being replaced.
        required: [ goal_id, reason ]
        additionalProperties: false
      output_schema_name: RESULT_OUTPUT_SCHEMA
      implementation:
        implementation_type: workflow_tool
        target: agency.system.goal
        callable_name: replan_goal
      security:
        read_only: false
        requires_approval: true
      tags: [ system, goal, agent_assignable, mutation, approval ]
    - id: agency.goal.pause
      name: pause_goal
      display_name: Pause Goal
      description: Pause a non-terminal durable goal so autonomous supervision and follow-up work should stop until the goal is resumed. Use this when work is temporarily blocked or no longer safe to continue automatically.
      tool_type: WORKFLOW_TOOL
      input_schema:
        type: object
        properties:
          goal_id:
            type: string
            description: ID of the durable goal to pause.
        required: [ goal_id ]
        additionalProperties: false
      output_schema_name: RESULT_OUTPUT_SCHEMA
      implementation:
        implementation_type: workflow_tool
        target: agency.system.goal
        callable_name: pause_goal
      security:
        read_only: false
        requires_approval: true
      tags: [ system, goal, agent_assignable, mutation, approval ]
    - id: agency.goal.resume
      name: resume_goal
      display_name: Resume Goal
      description: Resume a paused durable goal and mark it active again so autonomous planning, execution, and supervision may continue under the goal's constraints and approval policy.
      tool_type: WORKFLOW_TOOL
      input_schema:
        type: object
        properties:
          goal_id:
            type: string
            description: ID of the paused durable goal to resume.
        required: [ goal_id ]
        additionalProperties: false
      output_schema_name: RESULT_OUTPUT_SCHEMA
      implementation:
        implementation_type: workflow_tool
        target: agency.system.goal
        callable_name: resume_goal
      security:
        read_only: false
        requires_approval: true
      tags: [ system, goal, agent_assignable, mutation, approval ]
    - id: agency.goal.cancel
      name: cancel_goal
      display_name: Cancel Goal
      description: Cancel a non-terminal durable goal and record an optional reason. Use this when the objective should no longer be pursued and future supervisor actions should stop for this goal.
      tool_type: WORKFLOW_TOOL
      input_schema:
        type: object
        properties:
          goal_id:
            type: string
            description: ID of the durable goal to cancel.
          reason:
            type: [ string, "null" ]
            description: Optional cancellation reason stored in goal metadata.
        required: [ goal_id ]
        additionalProperties: false
      output_schema_name: RESULT_OUTPUT_SCHEMA
      implementation:
        implementation_type: workflow_tool
        target: agency.system.goal
        callable_name: cancel_goal
      security:
        read_only: false
        requires_approval: true
      tags: [ system, goal, agent_assignable, mutation, approval ]
    - id: agency.goal.evidence.attach
      name: attach_goal_evidence
      display_name: Attach Goal Evidence
      description: Attach structured evidence records to a durable goal before evaluation or completion. Use this when workflow executions, artifacts, approvals, or operator notes prove progress against goal success criteria.
      tool_type: WORKFLOW_TOOL
      input_schema:
        type: object
        properties:
          goal_id:
            type: string
            description: ID of the durable goal receiving evidence.
          evidence:
            type: array
            items:
              type: object
              additionalProperties: true
            description: Evidence records to append, ideally including id, type or kind, and criterion references when available.
        required: [ goal_id, evidence ]
        additionalProperties: false
      output_schema_name: RESULT_OUTPUT_SCHEMA
      implementation:
        implementation_type: workflow_tool
        target: agency.system.goal
        callable_name: attach_goal_evidence
      security:
        read_only: false
        requires_approval: true
      tags: [ system, goal, agent_assignable, mutation, approval ]
    - id: agency.goal.evaluate
      name: evaluate_goal
      display_name: Evaluate Goal
      description: Evaluate a durable goal's success criteria against recorded and optional new evidence. Output includes sufficiency, confidence, rationale, satisfied criteria, and missing evidence.
      tool_type: WORKFLOW_TOOL
      input_schema:
        type: object
        properties:
          goal_id:
            type: string
            description: ID of the durable goal to evaluate.
          evidence:
            type: array
            items:
              type: object
              additionalProperties: true
            description: Optional additional evidence records to evaluate without first attaching them.
          persist:
            type: boolean
            default: true
            description: Whether to persist the evaluation result on the goal. Defaults to true.
        required: [ goal_id ]
        additionalProperties: false
      output_schema_name: RESULT_OUTPUT_SCHEMA
      implementation:
        implementation_type: workflow_tool
        target: agency.system.goal
        callable_name: evaluate_goal
      security:
        read_only: false
        requires_approval: true
      tags: [ system, goal, agent_assignable, mutation, approval ]
    - id: agency.goal.supervisor-findings
      name: list_goal_supervisor_findings
      display_name: List Goal Supervisor Findings
      description: List durable main-agent supervisor findings, decisions, and recorded actions for a goal. Use this before explaining why a goal is blocked, what the supervisor observed, or what remains pending.
      tool_type: WORKFLOW_TOOL
      input_schema:
        type: object
        properties:
          goal_id:
            type: string
            description: ID of the durable goal whose supervisor records should be inspected.
        required: [ goal_id ]
        additionalProperties: false
      output_schema_name: RESULT_OUTPUT_SCHEMA
      implementation:
        implementation_type: workflow_tool
        target: agency.system.goal
        callable_name: list_goal_supervisor_findings
      security:
        read_only: true
      tags: [ system, goal, supervisor, agent_assignable, read_only ]
    - id: agency.goal.supervisor-decision.record
      name: record_goal_supervisor_decision
      display_name: Record Goal Supervisor Decision
      description: Record a durable supervisor decision for a goal, including rationale, risk, policy, recommended action, approval request id, or finding reference. Use this to make main-agent steering auditable.
      tool_type: WORKFLOW_TOOL
      input_schema:
        type: object
        properties:
          goal_id:
            type: string
            description: ID of the durable goal receiving the supervisor decision.
          decision:
            type: object
            description: Structured supervisor decision with action, rationale, risk, policy, finding reference, and approval metadata.
            additionalProperties: true
        required: [ goal_id, decision ]
        additionalProperties: false
      output_schema_name: RESULT_OUTPUT_SCHEMA
      implementation:
        implementation_type: workflow_tool
        target: agency.system.goal
        callable_name: record_goal_supervisor_decision
      security:
        read_only: false
        requires_approval: true
      tags: [ system, goal, supervisor, agent_assignable, mutation, approval ]
    - id: agency.goal.complete
      name: complete_goal
      display_name: Complete Goal
      description: Mark a durable goal completed with supporting evidence and optional evaluation metadata. Use this only when success criteria have enough recorded evidence for the operator or evaluator to inspect.
      tool_type: WORKFLOW_TOOL
      input_schema:
        type: object
        properties:
          goal_id:
            type: string
            description: ID of the durable goal to complete.
          evidence:
            type: array
            items:
              type: object
              additionalProperties: true
            description: Evidence records proving the goal success criteria have been satisfied.
          evaluation:
            type: [ object, "null" ]
            description: Optional evaluation result, rationale, confidence, or missing-evidence analysis.
            additionalProperties: true
        required: [ goal_id ]
        additionalProperties: false
      output_schema_name: RESULT_OUTPUT_SCHEMA
      implementation:
        implementation_type: workflow_tool
        target: agency.system.goal
        callable_name: complete_goal
      security:
        read_only: false
        requires_approval: true
      tags: [ system, goal, agent_assignable, mutation, approval ]
