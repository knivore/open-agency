    - id: agency.graph.working-set.summarize
      name: summarize_agency_graph_working_set
      display_name: Summarize Agency Graph Working Set
      description: Return a compact summary of an ephemeral graph working set without persisting it, preserving the useful anchors, selected nodes, notes, and provenance for the current reasoning step.
