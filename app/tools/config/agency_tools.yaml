      output_schema_name: RESULT_OUTPUT_SCHEMA
      implementation:
        implementation_type: workflow_tool
        target: agency.system.workflow
        callable_name: dispatch_workflow_monitor_proposal
      security:
        read_only: false
      tags: [ system, workflow, governance, proposal, agent_assignable, mutation ]
    - id: agency.workflow.improvement-proposals
      name: list_workflow_improvement_proposals
      display_name: List Workflow Improvement Proposals
      description: Review operator-created and monitor-created improvement proposals for one workflow, optionally filtered by proposal id or status. Use this before deciding whether to revise, dispatch, or apply a workflow improvement idea.
      tool_type: WORKFLOW_TOOL
      input_schema:
        type: object
        properties:
          workflow_id:
            type: string
            description: ID of the workflow whose proposal history should be reviewed.
          proposal_id:
            type: [ string, "null" ]
