          limit:
            type: [ integer, "null" ]
            description: Optional maximum number of proposals to return. Defaults to 20 and caps at 100.
        required: [ workflow_id ]
        additionalProperties: false
      output_schema_name: ITEMS_OUTPUT_SCHEMA
      implementation:
