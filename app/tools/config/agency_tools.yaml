      description: "Run one approved shell command workflow. Prefer Unix-style composition when it is concise: pipes, &&, ||, and ; are supported by the shell. Use command --help for discovery. Modes: auto, bash, sh, zsh, powershell, pwsh, cmd. Results include stdout, stderr, exit_code, duration_ms, and output_text with an [exit:N | duration] footer. Large output is truncated with an overflow file path for follow-up grep/head/tail exploration."
