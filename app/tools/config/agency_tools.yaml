              - string
              - "null"
            description: Optional human-facing display name.
          description:
            type: string
            description: Tool description shown to agents and operators.
          callable_name:
            type: string
            description: Python callable to expose from the generated package module.
          input_schema:
            type: object
            description: JSON schema for tool inputs.
            additionalProperties: true
          output_schema:
            type: object
            description: JSON schema for tool outputs.
            additionalProperties: true
          tags:
            type:
              - array
              - "null"
            items:
              type: string
            description: Optional extra tool tags.
          security:
            type:
              - object
              - "null"
            description: Optional security overrides merged onto safe generated-tool defaults.
            additionalProperties: true
        required: [ package_id, tool_id, name, description, callable_name, input_schema, output_schema ]
        additionalProperties: false
      output_schema_name: RESULT_OUTPUT_SCHEMA
      implementation:
        implementation_type: workflow_tool
        target: agency.system.tool
        callable_name: publish_generated_tool_definition
