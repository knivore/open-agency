name: PR Smoke

on:
  pull_request:

jobs:
  browser-runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run browser capability regression tests
        run: >-
          python -m unittest
          tests.test_browser_runtime
          tests.test_browser_tool
          tests.test_tool_migration
          tests.test_crewai_adapter
          tests.test_runtime_worker

      - name: Build and validate browser runtime
        run: make check-browser-runtime

  runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run runtime smoke tests
        run: python -m unittest tests.test_api_main tests.test_tool_contract_runtime tests.test_runtime_container_manager

      - name: Validate optional module separation
        run: make check-module-separation PYTHON=python

      - name: Validate optional module persistence manifests
        run: make check-optional-modules PYTHON=python

      - name: Run tool registry checks
        run: make check-tool-registry PYTHON=python

